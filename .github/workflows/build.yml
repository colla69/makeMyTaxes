name: Build

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # The project has no Node build. This step only installs the system packages of the browser.
      - name: Install the system packages for the browser tests
        run: npx --yes playwright@1.64.0 install-deps chromium
      - name: Build and run all tests, with the browser tests
        run: ./mvnw -B verify
      - name: Keep the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "*/target/surefire-reports/"
          retention-days: 7

  scanner-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the privacy scanner
        run: scripts/privacy-scan-test.sh
      - name: Test the deploy script
        run: scripts/deploy-live-test.sh
      - name: Install pdftotext for the guidance test
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Test the guidance library script
        run: scripts/guidance-test.sh

  live-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image from tracked files only
        run: git archive --format=tar HEAD | docker build -t makemytaxes:live -f deploy/Dockerfile -
      - name: Start the container and wait for the app
        env:
          MAKEMYTAXES_DATABASE_PASSPHRASE: made-up-for-the-build
        run: |
          MAKEMYTAXES_UID=$(id -u) MAKEMYTAXES_GID=$(id -g) docker compose -f deploy/compose.yaml up -d
          curl -fsS -o /dev/null --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:9090/

  law-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the law library from the pinned sources
        run: java scripts/FetchLaws.java
      - name: Check wording that differs between versions
        run: scripts/law-check.sh
