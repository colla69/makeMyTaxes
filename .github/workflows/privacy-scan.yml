name: Privacy scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan reads every commit, so the job needs the whole history.
          fetch-depth: 0
      - name: Test the scanner
        run: scripts/privacy-scan-test.sh
      - name: Scan every commit for personal data
        run: scripts/privacy-scan.sh --history
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
      - name: Scan every commit for secrets
        run: |
          "$(scripts/ensure-gitleaks.sh)" git --redact --no-banner --log-level warn .
