spring.application.name=makeMyTaxes

# The app must not accept connections from other devices.
server.address=127.0.0.1
# The port of the development version. PROD uses 9090.
server.port=9091

# The default location is outside the repository, so real data cannot enter it.
makemytaxes.database.path=${user.home}/.local/share/makemytaxes/makemytaxes.db
