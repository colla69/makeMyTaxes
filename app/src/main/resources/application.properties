spring.application.name=makeMyTaxes

# The app must not accept connections from other devices.
server.address=127.0.0.1
# The port of the development version. PROD uses 9090.
server.port=9091

# The URL of a static file holds a hash of its content. A browser then loads a changed style sheet
# at once, and does not show the old look from its cache.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# The default location is outside the repository, so real data cannot enter it.
makemytaxes.database.path=${user.home}/.local/share/makemytaxes/makemytaxes.db

# The assistant starts Claude Code, if it is installed and CLAUDE_CODE_OAUTH_TOKEN holds a token.
# The container mounts the Claude Code of the host at /opt/claude-code/claude.
makemytaxes.assistant.command=${MAKEMYTAXES_ASSISTANT_COMMAND:claude}
# Claude Code keeps its own settings here, apart from the user's own Claude Code settings.
makemytaxes.assistant.config-dir=${CLAUDE_CONFIG_DIR:${user.home}/.local/share/makemytaxes/claude-config}
# The law library that the law tools of the assistant read. The default is the folder law in the
# folder where the app starts. The containers mount it read-only at /law.
makemytaxes.law.path=${MAKEMYTAXES_LAW_PATH:law}

# The app accepts documents up to 20 MB and shows its own message for a larger file. An upload
# stays in memory up to the threshold, so the bytes of a document do not go to an unencrypted
# temporary file. The upload is parsed lazily, so that the document controller can show its
# message also for a file over the server limit. Tomcat then reads the rest of a large upload,
# so that the browser gets the answer and not a closed connection.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.servlet.multipart.file-size-threshold=26MB
spring.servlet.multipart.resolve-lazily=true
server.tomcat.max-swallow-size=-1
