# Short hints in Italian. The "?" beside a field shows them on hover.
# The key of a form field is hint.<form id>.<field id>.
# A hint explains what the field asks. It does not add a tax rule.

hint.expense.paidOn=Il giorno in cui hai pagato la spesa, nel formato gg.mm.aaaa.
hint.expense.amount=L'importo pagato in euro, per esempio 1.234,56.
hint.expense.topic=Il tipo di spesa. Decide in quale modulo e riga va la spesa.
hint.expense.description=Una breve descrizione della spesa, per ritrovarla in seguito.
hint.expense.receipt=Il nome del file o della cartella con la ricevuta o la fattura.
hint.expense.document=Un documento già caricato per questa dichiarazione.
hint.expense.statedBasis=Da dove viene l'importo quando per natura non esiste una ricevuta, per esempio un numero di giorni o una distanza.
hint.expense.file=Una ricevuta o fattura nuova, da caricare insieme a questa spesa.

hint.interview.personalDetails=Controlla i tuoi dati personali. Valgono per ogni anno e si cambiano nella pagina della persona.
hint.interview.occupation=Il lavoro che svolgi, per esempio impiegato o ingegnere.
hint.interview.commuteKm=La distanza di sola andata tra casa e prima sede di lavoro, in chilometri interi arrotondati per difetto.
hint.interview.commuteTransport=Il mezzo con cui hai fatto il tragitto casa-lavoro. Con un'auto propria o messa a tua disposizione (per esempio un'auto aziendale) il tetto annuo non vale per il tratto fatto in auto. Se hai usato mezzi diversi, l'app non divide i giorni per mezzo: controlla tu il calcolo.
hint.interview.commuteDays=Il numero di giorni in cui sei andato alla prima sede di lavoro.
hint.interview.homeOfficeDays=I giorni in cui hai lavorato da casa. Quali giorni contano dipende dall'anno: lo dice il testo di aiuto sotto il campo.
hint.interview.employed=Nell'anno hai ricevuto un salario come lavoratore dipendente?
hint.interview.wageCertificate=Hai la certificazione del salario (Lohnsteuerbescheinigung) di questo datore di lavoro? Se rispondi no, i valori contano come tua dichiarazione.
hint.interview.wageCertificateDocument=Carica il file della certificazione, oppure scegline una già caricata. Poi la vedi accanto ai campi.
hint.interview.workEquipment=Hai comprato tu qualcosa per il lavoro, per esempio un computer o libri tecnici?
hint.interview.workTraining=Hai pagato tu un corso di aggiornamento per la tua professione?
hint.interview.cleaning=Hai pagato una persona o un'impresa per le pulizie di casa?
hint.interview.gardening=Hai pagato qualcuno per la cura del tuo giardino?
hint.interview.craftsmen=Hai pagato artigiani per lavori in casa, per esempio una riparazione?
hint.interview.ancillaryCosts=Hai un rendiconto delle spese condominiali (Nebenkostenabrechnung) per la casa in affitto?
hint.interview.invoice=Chi ha emesso la fattura, con quale numero e quale data.
hint.interview.statement=Chi ha redatto il rendiconto delle spese condominiali, e con quale data.
hint.interview.paidAmount=L'importo che hai pagato in euro, per esempio 1.234,56.
hint.interview.labourCost=La parte della fattura per il costo del lavoro. Conta solo questa parte.
hint.interview.labourServices=Il costo del lavoro per servizi domestici indicato nel rendiconto.
hint.interview.labourCraftsmen=Il costo del lavoro per artigiani indicato nel rendiconto.
hint.interview.payment=Hai pagato sul conto di chi ha fatto il lavoro, per esempio con bonifico o addebito diretto? Un pagamento in contanti o su un altro conto non conta.
hint.interview.another=Hai un'altra fattura dello stesso tipo? Allora rispondi sì.
hint.interview.insurance=Hai pagato altre assicurazioni, per esempio responsabilità civile, infortuni, invalidità professionale o vita temporanea caso morte?
hint.interview.healthInsurance=La tua assicurazione sanitaria è pubblica (gesetzlich) o privata (privat)? Decide quali campi della certificazione del salario servono.
hint.interview.pensionEmployer=La quota del datore di lavoro per la pensione, sulla certificazione del salario. Se è vuoto, lascia vuoto il campo.
hint.interview.pensionEmployee=La tua quota per la pensione, sulla certificazione del salario. Se è vuoto, lascia vuoto il campo.
hint.interview.healthAllowanceStatutory=Il contributo esente del datore di lavoro all'assicurazione sanitaria pubblica, sulla certificazione del salario.
hint.interview.healthAllowancePrivate=Il contributo esente del datore di lavoro all'assicurazione sanitaria privata, sulla certificazione del salario.
hint.interview.careAllowance=Il contributo esente del datore di lavoro all'assicurazione di assistenza pubblica, sulla certificazione del salario.
hint.interview.healthEmployee=La tua quota per l'assicurazione sanitaria pubblica, sulla certificazione del salario.
hint.interview.careEmployee=La tua quota per l'assicurazione di assistenza (Pflegeversicherung), sulla certificazione del salario.
hint.interview.unemploymentEmployee=La tua quota per l'assicurazione contro la disoccupazione, sulla certificazione del salario.
hint.interview.privateHealthBasic=La parte dei contributi per la copertura di base (Basisabsicherung). È sulla certificazione annuale della tua assicurazione privata.
hint.interview.privateCare=I contributi per l'assicurazione di assistenza obbligatoria privata. È sulla certificazione annuale della tua assicurazione.
hint.interview.privateRefunds=I contributi che l'assicurazione ti ha restituito nell'anno. È sulla certificazione annuale della tua assicurazione.
hint.interview.donations=Hai donato soldi o beni, per esempio a un'associazione o a un partito?
hint.interview.medical=Hai pagato tu spese per medici, medicinali o occhiali?
hint.interview.childcare=Hai pagato per la cura di un bambino, per esempio un asilo nido?
hint.interview.employerName=Il nome del datore di lavoro. È in alto sulla certificazione del salario (Lohnsteuerbescheinigung).
hint.interview.employedFrom=Il primo giorno del rapporto di lavoro nell'anno, dalla certificazione del salario.
hint.interview.employedTo=L'ultimo giorno del rapporto di lavoro nell'anno, dalla certificazione del salario.
hint.interview.taxClass=La classe fiscale scritta sulla certificazione del salario.
hint.interview.grossWage=Il salario lordo sulla certificazione del salario.
hint.interview.wageTax=La ritenuta sul salario, sulla certificazione del salario.
hint.interview.solidarity=Il contributo di solidarietà sulla certificazione del salario. Se è vuoto, lascia vuoto il campo.
hint.interview.churchTax=L'imposta ecclesiastica sulla certificazione del salario. Se è vuoto, lascia vuoto il campo.
hint.interview.shortTimeWork=L'indennità per lavoro ridotto sulla certificazione del salario. Se è vuoto, lascia vuoto il campo.
hint.interview.employerCommute=Quanto il datore di lavoro ha pagato per il tragitto, dalla certificazione del salario.
hint.interview.anotherEmployer=Hai una seconda certificazione del salario, da un altro datore di lavoro? Allora rispondi sì.
hint.interview.taxOffice=Il nome dell'ufficio delle imposte competente per il tuo indirizzo.
hint.interview.iban=Il conto su cui l'ufficio delle imposte versa un eventuale rimborso.
hint.interview.otherIncome=Hai avuto redditi senza ritenuta sul salario, come un affitto o un lavoro autonomo accanto, sopra il limite indicato?
hint.interview.benefits=Hai ricevuto prestazioni sostitutive del reddito, come disoccupazione, assegno parentale o indennità di malattia, sopra il limite indicato?
hint.interview.severalEmployers=Hai lavorato per due o più datori di lavoro nello stesso periodo?
hint.interview.healthAllowance=La domanda nomina il caso di § 46 Abs. 2 Nr. 3 EStG che vale per il tuo anno. Questa regola cambia dal 2026. Rispondi sì se il caso della domanda vale per te.
hint.interview.wageTaxAllowance=Il salario era sopra il limite indicato e nei tuoi dati per la ritenuta sul salario c'era una franchigia (Freibetrag) secondo § 39a Abs. 1 Satz 1 Nr. 1-3, 5 o 6 EStG? Altre franchigie, per esempio per un secondo lavoro (Nr. 7), non contano.
hint.interview.specialPayment=La domanda nomina il caso di § 46 Abs. 2 Nr. 5 EStG che vale per il tuo anno. Questa regola cambia dal 2025. Rispondi sì se il caso della domanda vale per te.
hint.interview.certificateS=Sulla certificazione del salario (Lohnsteuerbescheinigung) c'è la lettera S?
hint.interview.officeRequest=L'ufficio delle imposte ti ha chiesto di presentare la dichiarazione per quest'anno, per esempio per lettera o con un avviso pubblico?

hint.filing-check.otherIncome=Hai avuto redditi senza ritenuta sul salario, come un affitto o un lavoro autonomo accanto, sopra il limite indicato?
hint.filing-check.benefits=Hai ricevuto prestazioni sostitutive del reddito, come disoccupazione, assegno parentale o indennità di malattia, sopra il limite indicato?
hint.filing-check.severalEmployers=Hai lavorato per due o più datori di lavoro nello stesso periodo?
hint.filing-check.healthAllowance=La domanda nomina il caso di § 46 Abs. 2 Nr. 3 EStG che vale per il tuo anno. Questa regola cambia dal 2026. Rispondi sì se il caso della domanda vale per te.
hint.filing-check.wageTaxAllowance=Il salario era sopra il limite indicato e nei tuoi dati per la ritenuta sul salario c'era una franchigia (Freibetrag) secondo § 39a Abs. 1 Satz 1 Nr. 1-3, 5 o 6 EStG? Altre franchigie, per esempio per un secondo lavoro (Nr. 7), non contano.
hint.filing-check.specialPayment=La domanda nomina il caso di § 46 Abs. 2 Nr. 5 EStG che vale per il tuo anno. Questa regola cambia dal 2025. Rispondi sì se il caso della domanda vale per te.
hint.filing-check.certificateS=Sulla certificazione del salario (Lohnsteuerbescheinigung) c'è la lettera S?
hint.filing-check.officeRequest=L'ufficio delle imposte ti ha chiesto di presentare la dichiarazione per quest'anno, per esempio per lettera o con un avviso pubblico?

hint.main.taxNumber=Il numero fiscale che ti ha dato l'ufficio delle imposte. È sulle sue lettere.
hint.main.taxOffice=Il nome dell'ufficio delle imposte competente per il tuo indirizzo.
hint.main.taxId=Il codice fiscale personale tedesco di 11 cifre. È sulla certificazione del salario.
hint.main.birthDate=La tua data di nascita, nel formato gg.mm.aaaa.
hint.main.lastName=Il tuo cognome.
hint.main.firstName=Il tuo nome di battesimo.
hint.main.street=La via del tuo indirizzo attuale.
hint.main.houseNumber=Il numero civico del tuo indirizzo attuale.
hint.main.postalCode=Il codice postale (CAP) del tuo indirizzo attuale.
hint.main.city=La città del tuo indirizzo attuale.
hint.main.occupation=Il lavoro che svolgi, per esempio impiegato o ingegnere.
hint.main.iban=Il conto su cui l'ufficio delle imposte versa un eventuale rimborso.
hint.main.benefits=Prestazioni sostitutive del reddito, come disoccupazione, assegno parentale o indennità di malattia.
hint.main.notes=Informazioni per l'ufficio delle imposte che non hanno un altro campo nel modulo.

hint.anlage-n.employerName=Il nome del datore di lavoro. È in alto sulla certificazione del salario.
hint.anlage-n.employedFrom=Il primo giorno del rapporto di lavoro nell'anno. È sulla certificazione del salario.
hint.anlage-n.employedTo=L'ultimo giorno del rapporto di lavoro nell'anno. È sulla certificazione del salario.
hint.anlage-n.taxClass=La classe fiscale per la ritenuta sul salario. È sulla certificazione del salario.
hint.anlage-n.grossWage=Il salario lordo dell'anno. È sulla certificazione del salario.
hint.anlage-n.wageTax=La ritenuta sul salario trattenuta dal datore di lavoro. È sulla certificazione del salario.
hint.anlage-n.solidarity=Il contributo di solidarietà trattenuto. È sulla certificazione del salario.
hint.anlage-n.churchTax=L'imposta ecclesiastica trattenuta. È sulla certificazione del salario.
hint.anlage-n.shortTimeWork=L'indennità per lavoro ridotto. È sulla certificazione del salario.
hint.anlage-n.workplace=La prima sede di lavoro (erste Tätigkeitsstätte): CAP, città e via.
hint.anlage-n.commuteDays=Il numero di giorni in cui sei andato al luogo di lavoro.
hint.anlage-n.commuteKm=La distanza di sola andata tra casa e lavoro, in chilometri interi arrotondati per difetto.
hint.anlage-n.commuteTransport=Il mezzo con cui hai fatto il tragitto casa-lavoro.
hint.anlage-n.employerCommute=Quanto il datore di lavoro ha pagato per il tragitto. È sulla certificazione del salario.
hint.anlage-n.homeOfficeDays=I giorni in cui hai lavorato da casa. Quali giorni contano dipende dall'anno: lo dice il testo di aiuto sotto il campo.

hint.household-services.invoice=Chi ha emesso la fattura, con quale numero e quale data.
hint.household-services.statement=Chi ha redatto il rendiconto delle spese condominiali, e con quale data.
hint.household-services.paidAmount=L'importo che hai pagato in euro.
hint.household-services.labourCost=La parte della fattura per il costo del lavoro. Conta solo questa parte.
hint.household-services.labourServices=Il costo del lavoro per servizi domestici indicato nel rendiconto.
hint.household-services.labourCraftsmen=Il costo del lavoro per artigiani indicato nel rendiconto.
hint.household-services.payment=Come hai pagato. Conta solo un pagamento sul conto di chi ha fatto il lavoro, per esempio con bonifico o addebito diretto.

hint.anlage-vorsorgeaufwand.pensionEmployer=La quota del datore di lavoro per la pensione. È sulla certificazione del salario.
hint.anlage-vorsorgeaufwand.pensionEmployee=La tua quota per la pensione. È sulla certificazione del salario.
hint.anlage-vorsorgeaufwand.healthAllowanceStatutory=Il contributo esente del datore di lavoro all'assicurazione sanitaria pubblica. È sulla certificazione del salario.
hint.anlage-vorsorgeaufwand.healthAllowancePrivate=Il contributo esente del datore di lavoro all'assicurazione sanitaria privata. È sulla certificazione del salario.
hint.anlage-vorsorgeaufwand.careAllowance=Il contributo esente del datore di lavoro all'assicurazione di assistenza pubblica. È sulla certificazione del salario.
hint.anlage-vorsorgeaufwand.healthEmployee=La tua quota per l'assicurazione sanitaria pubblica. È sulla certificazione del salario.
hint.anlage-vorsorgeaufwand.careEmployee=La tua quota per l'assicurazione di assistenza. È sulla certificazione del salario.
hint.anlage-vorsorgeaufwand.unemploymentEmployee=La tua quota per l'assicurazione contro la disoccupazione. È sulla certificazione del salario.
hint.anlage-vorsorgeaufwand.privateHealthBasic=I contributi per la copertura di base dell'assicurazione sanitaria privata, dalla certificazione dell'assicurazione.
hint.anlage-vorsorgeaufwand.privateCare=I contributi per l'assicurazione di assistenza obbligatoria privata, dalla certificazione dell'assicurazione.
hint.anlage-vorsorgeaufwand.privateRefunds=I contributi restituiti nell'anno, dalla certificazione dell'assicurazione.
