<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- The chat with the assistant, beside the tabs of a return. It shows only while the person of
         the return has the assistant on. The user opens and closes it with the summary. -->
    <th:block th:fragment="chat" th:with="chat=${@assistantController.panel(returnId)}">
      <details th:if="${chat != null}" id="assistant-chat" class="assistant-chat">
        <summary>Assistent</summary>
        <p class="assistant-sees">Der Assistent sieht:</p>
        <ul class="assistant-seen">
          <li th:each="seen : ${chat.seenReturns}" th:text="${seen}">Steuererklärung</li>
        </ul>
        <!-- The page can have its own error and question, so the panel clears both. -->
        <th:block th:with="messages=${chat.messages},error=${null},question=${null}">
          <div th:replace="~{assistant-chat :: conversation}"></div>
        </th:block>
      </details>
    </th:block>

    <!-- htmx swaps this part with the answer. -->
    <div th:fragment="conversation" id="assistant-conversation">
      <ol class="assistant-messages">
        <li th:each="message : ${messages}"
            th:class="${message.author.name() == 'USER'} ? 'from-user' : 'from-assistant'"
            th:text="${message.text}">Nachricht</li>
      </ol>
      <p class="assistant-error" th:if="${error}" th:text="${error}">Fehler</p>
      <form class="assistant-ask"
            th:attr="hx-post=@{/returns/{id}/assistant(id=${returnId})}"
            hx-target="#assistant-conversation"
            hx-swap="outerHTML"
            hx-indicator="#assistant-working"
            hx-disabled-elt="find button">
        <label for="assistant-question">Frage an den Assistenten</label>
        <textarea id="assistant-question" name="question" rows="3" required
                  th:text="${question}"></textarea>
        <p>
          <button>Fragen</button>
          <span id="assistant-working" class="htmx-indicator">Der Assistent arbeitet …</span>
        </p>
      </form>
    </div>
  </body>
</html>
