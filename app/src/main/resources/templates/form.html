<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${form.title} + ' ' + ${taxYear}">Vordruck</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <script th:src="@{/fields.js}" defer></script>
    <script th:src="@{/document-check.js}" defer></script>
  </head>
  <body>
    <nav th:replace="~{nav :: nav}"></nav>
    <main class="panel">
    <h1 th:text="${form.title} + ' ' + ${taxYear}">Vordruck</h1>
    <p class="without-lines" th:if="${withoutFormLines}">Die Felder haben noch keine Zeilennummern des Vordrucks, weil der amtliche Vordruck dieses Jahres noch nicht geprüft ist.</p>
    <p class="saved" th:if="${saved}">Gespeichert.</p>
    <!-- After each save of a field, fields.js writes the checks of several fields here. -->
    <div id="form-messages"><p class="error" th:each="message : ${formErrors}" th:text="${message}">Fehler</p></div>
    <p class="error" th:unless="${#maps.isEmpty(errors)}">Die markierten Felder sind nicht gespeichert. Korrigieren Sie sie.</p>

    <!-- data-autosave: fields.js saves each field to this address when the user leaves it. -->
    <form id="answers" method="post"
          th:data-autosave="@{/returns/{r}/forms/{f}/field(r=${returnId},f=${form.id})}"
          th:action="@{/returns/{r}/forms/{f}(r=${returnId},f=${form.id})}">
      <section class="field-group" th:each="group : ${fieldGroups}">
        <h2 th:text="${group.title}">Abschnitt</h2>
        <p th:if="${group.documentId}">
          <button type="button"
                  th:data-document-check="@{/returns/{r}/forms/{f}/document-check(r=${returnId},f=${form.id},document=${group.documentId})}">Mit der Lohnsteuerbescheinigung prüfen</button>
        </p>
        <div th:classappend="${group.documentHref} ? 'with-document'">
        <div class="fields">
          <th:block th:each="field : ${group.fields}">
            <div th:replace="~{fields :: field(name=${field.id}, label=${field.label}, value=${values[field.id]}, line=${field.line}, help=${field.help}, hint=${#messages.msgOrNull('hint.' + form.id + '.' + field.hintId())}, fieldError=${errors[field.id]}, options=${field.kind.options()}, blankOption=true, kind=${field.kind.name()})}"></div>
          </th:block>
        </div>
        <iframe class="certificate-view" th:if="${group.documentHref}" title="Lohnsteuerbescheinigung" th:src="@{${group.documentHref}}"></iframe>
        </div>
      </section>
      <p class="form-buttons">
        <button>Speichern</button>
        <button type="button" data-clear-form>Alle Felder leeren</button>
      </p>
    </form>

    <th:block th:if="${filing}">
      <section th:replace="~{filing-result :: result}"></section>
    </th:block>
    </main>
  </body>
</html>
