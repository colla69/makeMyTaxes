<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>makeMyTaxes</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <script th:src="@{/fields.js}" defer></script>
  </head>
  <body>
    <!-- The same panel as the pages with tabs, so that every field has the same width. -->
    <main class="panel">
    <h1>makeMyTaxes</h1>

    <section th:each="person : ${persons}">
      <div class="person-head">
        <h2 th:text="${person.name}">Name</h2>
        <a th:href="@{/persons/{id}(id=${person.id})}">Persönliche Angaben ändern</a>
      </div>
      <!-- A button opens the return of its year, and creates the return first if it does not exist. -->
      <form class="year-buttons" method="post" th:action="@{/persons/{id}/returns(id=${person.id})}">
        <button th:each="year : ${years}" name="taxYear" th:value="${year}"
                th:text="'Steuererklärung ' + ${year}">Steuererklärung</button>
      </form>
      <ul>
        <li th:each="taxReturn : ${person.returns}" th:unless="${#lists.contains(years, taxReturn.taxYear.value)}">
          <a th:href="@{/returns/{id}(id=${taxReturn.id})}"
             th:text="'Steuererklärung ' + ${taxReturn.taxYear.value}">Steuererklärung</a>
        </li>
      </ul>
    </section>

    <section>
      <h2>Person anlegen</h2>
      <p class="error" th:unless="${#maps.isEmpty(errors)}">Nichts wurde gespeichert. Korrigieren Sie die markierten Felder.</p>
      <form id="new-person" class="fields" method="post" th:action="@{/persons}">
        <div th:replace="~{person-details :: details}"></div>
        <button>Person anlegen</button>
      </form>
    </section>
    </main>
  </body>
</html>
