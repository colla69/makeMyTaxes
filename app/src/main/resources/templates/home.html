<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>makeMyTaxes</title>
    <link rel="stylesheet" th:href="@{/app.css}">
  </head>
  <body>
    <h1>makeMyTaxes</h1>

    <section th:each="person : ${persons}">
      <h2 th:text="${person.name}">Name</h2>
      <ul>
        <li th:each="taxReturn : ${person.returns}">
          <a th:href="@{/returns/{id}(id=${taxReturn.id})}"
             th:text="'Return ' + ${taxReturn.taxYear.value}">Return</a>
        </li>
      </ul>
      <form class="fields" method="post" th:action="@{/persons/{id}/returns(id=${person.id})}">
        <div th:replace="~{fields :: field(name='taxYear', label='Tax year', type='number', min='2000', max='2100', required=true)}"></div>
        <button>Add return</button>
      </form>
    </section>

    <section>
      <h2>Add a person</h2>
      <form class="fields" method="post" th:action="@{/persons}">
        <div th:replace="~{fields :: field(name='name', label='Name', required=true)}"></div>
        <button>Add person</button>
      </form>
    </section>
  </body>
</html>
