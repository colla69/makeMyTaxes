<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- The pages of one return show as tabs. The tab of the open page has aria-current="page".
         A done page has the class "done". -->
    <nav th:fragment="nav" th:with="done=${@returnProgress.doneTabs(returnId)}">
      <a th:href="@{/}">Zurück</a>
      <div class="tabs">
        <a th:unless="${#lists.isEmpty(forms)}"
           th:href="@{/returns/{id}/interview(id=${returnId})}"
           th:classappend="${done.contains('interview')} ? 'done'"
           th:attr="aria-current=${tab == 'interview'} ? 'page' : null">Fragen</a>
        <a th:href="@{/returns/{id}(id=${returnId})}"
           th:attr="aria-current=${tab == 'expenses'} ? 'page' : null">Ausgaben</a>
        <a th:href="@{/returns/{id}/documents(id=${returnId})}"
           th:attr="aria-current=${tab == 'documents'} ? 'page' : null">Belege</a>
        <a th:each="item : ${forms}"
           th:href="@{/returns/{r}/forms/{f}(r=${returnId},f=${item.id})}"
           th:classappend="${done.contains(item.id)} ? 'done'"
           th:attr="aria-current=${tab == item.id} ? 'page' : null"
           th:text="${item.title}">Vordruck</a>
        <a th:unless="${#lists.isEmpty(forms)}"
           th:href="@{/returns/{id}/review(id=${returnId})}"
           th:attr="aria-current=${tab == 'review'} ? 'page' : null">Übersicht</a>
      </div>
      <!-- A year without a definition has no forms, so the tabs above say why they are missing. -->
      <p th:if="${#lists.isEmpty(forms)}" class="no-rules">Für dieses Jahr gibt es noch keine Regeln.</p>
      <aside th:replace="~{assistant-chat :: chat}"></aside>
    </nav>
  </body>
</html>
