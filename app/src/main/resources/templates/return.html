<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>makeMyTaxes</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <script th:src="@{/fields.js}" defer></script>
    <script th:src="@{/webjars/htmx.org/2.0.11/dist/htmx.min.js}" defer></script>
  </head>
  <body>
    <nav th:replace="~{nav :: nav}"></nav>
    <main class="panel">

    <div id="panel" th:fragment="panel">
      <h1 th:text="'Steuererklärung ' + ${taxYear}">Steuererklärung</h1>

      <!-- data-remember: fields.js keeps the input of this form while the user switches tabs. -->
      <form id="expense-form"
            class="fields"
            data-remember
            method="post"
            th:action="@{/returns/{id}/expenses(id=${returnId})}"
            th:attr="hx-post=@{/returns/{id}/expenses(id=${returnId})}"
            hx-target="#panel"
            hx-swap="outerHTML">
        <p class="error" th:if="${error}" th:text="${error}">Fehler</p>
        <div th:replace="~{fields :: field(name='paidOn', label='Datum', hint=#{hint.expense.paidOn}, value=${form.paidOn}, placeholder='TT.MM.JJJJ', required=true, kind='DATE')}"></div>
        <div th:replace="~{fields :: field(name='amount', label='Betrag (EUR)', hint=#{hint.expense.amount}, value=${form.amount}, placeholder='1.234,56', required=true, autofocus=true, kind='MONEY')}"></div>
        <div th:replace="~{fields :: field(name='topic', label='Kategorie', hint=#{hint.expense.topic}, value=${form.topic?.name}, options=${topics})}"></div>
        <div th:replace="~{fields :: field(name='description', label='Beschreibung', hint=#{hint.expense.description}, value=${form.description}, required=true)}"></div>
        <div th:replace="~{fields :: field(name='receipt', label='Beleg', hint=#{hint.expense.receipt}, value=${form.receipt}, placeholder='Dateiname oder Ordner')}"></div>
        <p class="form-buttons">
          <button>Ausgabe hinzufügen</button>
          <button type="button" data-clear-form>Alle Felder leeren</button>
        </p>
      </form>

      <h2>Summen</h2>
      <p class="warning" th:if="${withoutReceipt > 0}" th:text="${withoutReceipt} + ' ohne Beleg'">0</p>
      <table>
        <tr th:each="total : ${totals}">
          <td th:text="${total.topic}">Kategorie</td>
          <td class="amount" th:text="${total.total}">0,00</td>
        </tr>
      </table>

      <h2>Ausgaben</h2>
      <table id="expenses">
        <thead>
          <tr><th>Datum</th><th>Betrag</th><th>Kategorie</th><th>Beschreibung</th><th>Beleg</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="row : ${rows}">
            <td th:text="${row.paidOn}">01.01.2022</td>
            <td class="amount" th:text="${row.amount}">0,00</td>
            <td th:text="${row.topic}">Kategorie</td>
            <td th:text="${row.description}">Beschreibung</td>
            <td th:text="${row.receipt}">Beleg</td>
            <td>
              <!-- novalidate: htmx would stop the delete if the entry in progress is incomplete. -->
              <form method="post"
                    novalidate
                    th:action="@{/returns/{r}/expenses/{e}/delete(r=${returnId},e=${row.id})}"
                    th:attr="hx-post=@{/returns/{r}/expenses/{e}/delete(r=${returnId},e=${row.id})}"
                    hx-include="#expense-form"
                    hx-target="#panel"
                    hx-swap="outerHTML">
                <button>Löschen</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    </main>
  </body>
</html>
