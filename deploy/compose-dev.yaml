# The dev container. It runs the latest dev branch with made-up test data only.
# Start or update it with scripts/deploy-dev.sh. The review script runs it after each merge into dev.
name: makemytaxes-dev

services:
  app:
    image: makemytaxes:dev
    # Only scripts/deploy-dev.sh makes this image. Never get an image with this name from a registry.
    pull_policy: never
    container_name: makemytaxes-dev
    restart: unless-stopped
    user: "${MAKEMYTAXES_UID:-1000}:${MAKEMYTAXES_GID:-1000}"
    # The app keeps its bind to 127.0.0.1. See compose.yaml.
    network_mode: host
    environment:
      MAKEMYTAXES_DATABASE_PASSPHRASE: ${MAKEMYTAXES_DATABASE_PASSPHRASE:?Set it in deploy/.env.dev}
      MAKEMYTAXES_DATABASE_PATH: /data/makemytaxes.db
      SERVER_PORT: "9091"
      # The assistant. See compose.yaml.
      MAKEMYTAXES_ASSISTANT_COMMAND: /opt/claude-code/claude
      CLAUDE_CONFIG_DIR: /claude-config
      MAKEMYTAXES_LAW_PATH: /law
    env_file:
      - path: ${MAKEMYTAXES_ASSISTANT_TOKEN_FILE:-${HOME}/.config/makemytaxes/assistant.env}
        required: false
    volumes:
      - ./data-dev:/data
      - ${MAKEMYTAXES_CLAUDE_CODE:-./no-claude-code}:/opt/claude-code/claude:ro
      - claude-config:/claude-config
      - ../law:/law:ro

volumes:
  claude-config:
