# The live container. Start or update it with scripts/deploy-live.sh <tag>.
name: makemytaxes-live

services:
  app:
    image: makemytaxes:live
    # Only scripts/deploy-live.sh makes this image. Never get an image with this name from a registry.
    pull_policy: never
    container_name: makemytaxes-live
    restart: unless-stopped
    user: "${MAKEMYTAXES_UID:-1000}:${MAKEMYTAXES_GID:-1000}"
    # The app keeps its bind to 127.0.0.1 from application.properties, on the network of this machine.
    # Do not use "ports" with a bind to 0.0.0.0: some Docker versions then let other devices reach the
    # container directly.
    network_mode: host
    environment:
      MAKEMYTAXES_DATABASE_PASSPHRASE: ${MAKEMYTAXES_DATABASE_PASSPHRASE:?Set it in deploy/.env}
      MAKEMYTAXES_DATABASE_PATH: /data/makemytaxes.db
      SERVER_PORT: "9090"
    volumes:
      - ./data:/data
