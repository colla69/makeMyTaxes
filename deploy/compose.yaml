# The live container. Start or update it with scripts/deploy-live.sh <tag>.
name: makemytaxes-live

services:
  app:
    image: makemytaxes:live
    # Only scripts/deploy-live.sh makes this image. Never get an image with this name from a registry.
    pull_policy: never
    container_name: makemytaxes-live
    restart: unless-stopped
    user: "${MAKEMYTAXES_UID:-1000}:${MAKEMYTAXES_GID:-1000}"
    # The app keeps its bind to 127.0.0.1 from application.properties, on the network of this machine.
    # Do not use "ports" with a bind to 0.0.0.0: some Docker versions then let other devices reach the
    # container directly.
    network_mode: host
    environment:
      MAKEMYTAXES_DATABASE_PASSPHRASE: ${MAKEMYTAXES_DATABASE_PASSPHRASE:?Set it in deploy/.env}
      MAKEMYTAXES_DATABASE_PATH: /data/makemytaxes.db
      SERVER_PORT: "9090"
      # The assistant. See the commands section of CLAUDE.md. Claude Code keeps its settings in its own
      # volume, so it never sees the user's own Claude Code settings.
      MAKEMYTAXES_ASSISTANT_COMMAND: /opt/claude-code/claude
      CLAUDE_CONFIG_DIR: /claude-config
      MAKEMYTAXES_LAW_PATH: /law
    # The token for Claude Code: a file outside the repository with the line
    # CLAUDE_CODE_OAUTH_TOKEN=<token>. Without the file, the assistant is not available.
    env_file:
      - path: ${MAKEMYTAXES_ASSISTANT_TOKEN_FILE:-${HOME}/.config/makemytaxes/assistant.env}
        required: false
    volumes:
      - ./data:/data
      # The Claude Code of the host, read-only, so nothing of it enters the image. The default is an
      # empty file, so that the assistant is not available.
      - ${MAKEMYTAXES_CLAUDE_CODE:-./no-claude-code}:/opt/claude-code/claude:ro
      - claude-config:/claude-config
      # The law library of this checkout, read-only, for the law tools of the assistant.
      - ../law:/law:ro

volumes:
  claude-config:
